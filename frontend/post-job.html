<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Job - SkillBridge</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>SkillBridge</h1>
            <nav>
                <a href="recruiter-dashboard.html">Back to Dashboard</a>
                <a href="#" onclick="window.Auth.logout(); return false;" class="btn-secondary">Logout</a>
            </nav>
        </div>
    </header>

    <div class="container" style="max-width: 800px; padding: 2rem 20px;">
        <div class="card">
            <h2 style="margin-bottom: 1.5rem; color: var(--primary-brand);">Create New Job Posting</h2>
            
            <form id="postJobFormStandalone">
                <div class="form-row">
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" id="jobTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Company Name</label>
                        <input type="text" id="companyName" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="jobLocation" required>
                    </div>
                    <div class="form-group">
                        <label>Employment Type</label>
                        <select id="employmentType" required>
                            <option value="full-time">Full-Time</option>
                            <option value="part-time">Part-Time</option>
                            <option value="contract">Contract</option>
                            <option value="internship">Internship</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="jobDescription" rows="5" required></textarea>
                </div>

                <h3 style="margin: 2rem 0 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Required & Preferred Skills</h3>
                
                <div id="standaloneSkillsContainer" class="skill-tags" style="margin-bottom: 1rem;"></div>
                
                <div class="card" style="background: var(--neutral-bg); margin-bottom: 2rem;">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Select Skill</label>
                            <select id="jobSkillSelect"></select>
                        </div>
                        <div class="form-group">
                            <label>Requirement Level</label>
                            <select id="jobSkillRequired">
                                <option value="true">Mandatory</option>
                                <option value="false">Bonus/Preferred</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" class="btn-secondary" onclick="addStandaloneSkill()">Add Skill to Job</button>
                </div>

                <button type="submit" class="btn-primary w-full" style="padding: 1rem; font-size: 1.1rem;">Publish Job</button>
            </form>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <!-- Note: A standalone script for this page would normally be isolated, reusing recruiter logic for brevity here -->
    <script>
        window.Auth.protectRoute(['recruiter']);
        
        let localDraftSkills = [];
        let localSkillsMap = {};

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const skills = await window.ApiClient.get('/skills');
                const select = document.getElementById('jobSkillSelect');
                skills.forEach(s => localSkillsMap[s.id] = s.name);
                select.innerHTML = '<option value="">Select a skill...</option>' + 
                    skills.map(s => `<option value="${s.id}">${s.name} (${s.category})</option>`).join('');
            } catch (error) {
                console.error("Failed to load skills", error);
            }
        });

        function addStandaloneSkill() {
            const select = document.getElementById('jobSkillSelect');
            const requiredSelect = document.getElementById('jobSkillRequired');
            if (!select.value) return;
            if (localDraftSkills.some(s => s.skill_id === select.value)) return alert("Skill already added");
            
            localDraftSkills.push({
                skill_id: select.value,
                is_required: requiredSelect.value === 'true',
                weight: 1.0
            });
            renderStandaloneSkills();
        }

        function removeStandaloneSkill(id) {
            localDraftSkills = localDraftSkills.filter(s => s.skill_id !== id);
            renderStandaloneSkills();
        }

        function renderStandaloneSkills() {
            document.getElementById('standaloneSkillsContainer').innerHTML = localDraftSkills.map(s => `
                <span class="badge ${s.is_required ? 'badge-red' : 'badge-blue'}">
                    ${s.is_required ? 'Req:' : 'Pref:'} ${localSkillsMap[s.skill_id]} 
                    <button type="button" style="background:none; border:none; margin-left:5px; cursor:pointer;" onclick="removeStandaloneSkill('${s.skill_id}')">×</button>
                </span>
            `).join('');
        }

        document.getElementById('postJobFormStandalone').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.textContent = "Publishing...";

            const payload = {
                title: document.getElementById('jobTitle').value,
                company_name: document.getElementById('companyName').value,
                location: document.getElementById('jobLocation').value,
                employment_type: document.getElementById('employmentType').value,
                description: document.getElementById('jobDescription').value,
                is_active: true,
                skills: localDraftSkills
            };

            try {
                await window.ApiClient.post('/jobs', payload);
                alert('Job posted successfully!');
                window.location.href = 'recruiter-dashboard.html';
            } catch (error) {
                alert("Failed to post job: " + error.message);
                btn.disabled = false; btn.textContent = "Publish Job";
            }
        });
    </script>
</body>
</html>
