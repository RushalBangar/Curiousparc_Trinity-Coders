<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started — SkillBridge</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-brand">
                    <div class="brand-icon">⚡</div>
                    <span>Skill<span class="brand-gradient-text">Bridge</span></span>
                </a>
                <h2>Create Your Account</h2>
                <p>Join the bias-free competency matching network</p>
            </div>
            
            <!-- Segmented Role Selector -->
            <div class="role-segmented-control">
                <button type="button" class="role-segment-btn active" id="btnRoleSeeker" onclick="setRole('seeker')">
                    <span>👤</span> Candidate
                </button>
                <button type="button" class="role-segment-btn" id="btnRoleRecruiter" onclick="setRole('recruiter')">
                    <span>🏢</span> Employer
                </button>
            </div>

            <form id="registerForm">
                <input type="hidden" id="role" value="seeker">

                <div class="form-group">
                    <label for="fullName">Full Legal Name</label>
                    <input type="text" id="fullName" placeholder="e.g. Alex Morgan" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="alex@domain.com" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Choose Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                </div>
                
                <button type="submit" class="btn-primary w-full btn-lg" style="margin-top: 0.5rem;" id="submitBtn">
                    <span>Complete Registration</span>
                </button>
                
                <div style="text-align: center; margin: 1.5rem 0; position: relative;">
                    <hr style="border: 0; border-top: 1px solid var(--border-subtle);">
                    <span style="position: absolute; top: -0.65rem; left: 50%; transform: translateX(-50%); background: var(--bg-surface); padding: 0 0.75rem; font-size: 0.85rem; color: var(--text-muted);">Or continue with</span>
                </div>
                
                <button type="button" class="btn-secondary w-full btn-lg" onclick="window.Auth.loginWithGoogle(document.getElementById('role').value)" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    <span>Sign up with Google</span>
                </button>
            </form>
            
            <p class="auth-footer">
                Already registered? <a href="login.html">Sign in instead</a>
            </p>
        </div>

        <a href="index.html" class="back-home-link">
            ← Return to SkillBridge Homepage
        </a>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        function setRole(role) {
            document.getElementById('role').value = role;
            const btnSeeker = document.getElementById('btnRoleSeeker');
            const btnRecruiter = document.getElementById('btnRoleRecruiter');
            
            if (role === 'seeker') {
                btnSeeker.classList.add('active');
                btnRecruiter.classList.remove('active');
            } else {
                btnRecruiter.classList.add('active');
                btnSeeker.classList.remove('active');
            }
        }

        // Check if role is passed in query params
        const urlParams = new URLSearchParams(window.location.search);
        const preSelectedRole = urlParams.get('role');
        if (preSelectedRole && (preSelectedRole === 'seeker' || preSelectedRole === 'recruiter')) {
            setRole(preSelectedRole);
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                full_name: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span>Creating Profile...</span>';
            btn.disabled = true;
            
            try {
                await window.Auth.register(userData);
                window.Toast.success('Account created successfully! Redirecting...', 'Success');
            } catch (err) {
                window.Toast.error(err.message || 'Registration failed. Please try again.', 'Error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
