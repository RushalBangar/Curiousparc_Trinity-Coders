<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SkillBridge</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p>Join SkillBridge today</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="role">I am a...</label>
                    <select id="role" required>
                        <option value="seeker">Job Seeker</option>
                        <option value="recruiter">Recruiter / Employer</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary w-full">Sign Up</button>
            </form>
            
            <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        // Check if role is passed in query params
        const urlParams = new URLSearchParams(window.location.search);
        const preSelectedRole = urlParams.get('role');
        if (preSelectedRole && (preSelectedRole === 'seeker' || preSelectedRole === 'recruiter')) {
            document.getElementById('role').value = preSelectedRole;
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };
            
            const btn = e.target.querySelector('button');
            btn.textContent = 'Creating Account...';
            btn.disabled = true;
            
            await window.Auth.register(userData);
            
            btn.textContent = 'Sign Up';
            btn.disabled = false;
        });
    </script>
</body>
</html>
