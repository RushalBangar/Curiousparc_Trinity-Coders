<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Roadmap — SkillBridge</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <style>
        .roadmap-header {
            padding: 3rem 0;
            background: linear-gradient(135deg, #1e3a8a, #4338ca);
            color: white;
            text-align: center;
            border-bottom: 5px solid var(--primary-400);
        }
        .roadmap-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .playlist-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            padding: 2rem 0;
        }
        .video-card {
            background: white;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s;
            border: 1px solid var(--border-subtle);
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        .video-thumbnail {
            width: 100%;
            height: 180px;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 3rem;
        }
        .video-info {
            padding: 1rem;
        }
        .video-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .video-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <!-- Site Header -->
    <header class="site-header">
        <div class="container">
            <a href="index.html" class="brand-logo" style="display: flex; align-items: center; gap: 0.75rem;">
                <img src="assets/images/logo.jpg" alt="SkillBridge Logo" style="width: 36px; height: 36px; border-radius: 8px; object-fit: cover;">
                <span>Skill<span class="brand-gradient-text">Bridge</span></span>
            </a>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button onclick="window.close()" class="btn-secondary btn-sm">Close Tab</button>
            </div>
        </div>
    </header>

    <div class="roadmap-header">
        <div class="container">
            <h1 id="skillTitle">Loading Roadmap...</h1>
            <p>Curated learning path to help you master this competency and boost your match score.</p>
        </div>
    </div>

    <div class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>Recommended Playlist</h2>
            <span class="badge badge-purple">Beginner to Advanced</span>
        </div>
        
        <div class="playlist-container" id="playlistContainer">
            <!-- Populated by JS -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const skillName = params.get('skill') || 'this skill';
            
            document.getElementById('skillTitle').textContent = `Mastering ${skillName}`;
            
            const container = document.getElementById('playlistContainer');
            
            // Generate some dynamic mock playlist items based on the skill name
            const videos = [
                { title: `${skillName} in 100 Seconds`, duration: '1:54', channel: 'Fireship' },
                { title: `${skillName} Crash Course for Beginners`, duration: '1:24:10', channel: 'Traversy Media' },
                { title: `Advanced ${skillName} Concepts You Need to Know`, duration: '45:20', channel: 'Web Dev Simplified' },
                { title: `Building a Real Project with ${skillName}`, duration: '2:10:05', channel: 'FreeCodeCamp' },
                { title: `Top 10 Interview Questions on ${skillName}`, duration: '15:30', channel: 'Tech Interview Pro' },
                { title: `${skillName} Best Practices & Architecture`, duration: '32:15', channel: 'Hussein Nasser' }
            ];
            
            container.innerHTML = videos.map((v, i) => `
                <div class="video-card">
                    <div class="video-thumbnail" style="position: relative; background: linear-gradient(45deg, #1e293b, #334155);">
                        <svg width="48" height="48" fill="#fff" viewBox="0 0 16 16">
                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                            <path d="M6.271 5.055a.5.5 0 0 1 .52.038l3.5 2.5a.5.5 0 0 1 0 .814l-3.5 2.5A.5.5 0 0 1 6 10.5v-5a.5.5 0 0 1 .271-.445z"/>
                        </svg>
                        <span style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600;">
                            ${v.duration}
                        </span>
                    </div>
                    <div class="video-info">
                        <div class="video-title">#${i+1} - ${v.title}</div>
                        <div class="video-meta">
                            ${v.channel} • 1.${(Math.random() * 9).toFixed(1)}M views
                        </div>
                        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.title)}" target="_blank" class="btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.5rem; text-decoration: none; text-align: center; display: inline-block;">
                            Play Video
                        </a>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
